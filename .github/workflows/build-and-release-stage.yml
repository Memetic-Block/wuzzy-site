name: Build & Publish Wuzzy Site Stage Image

on:
  push:
    branches: master
env:
  IMAGE_NAME: wuzzy-site

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Build image
        run: |
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          docker build . \
            --file Dockerfile \
            --tag $IMAGE_NAME \
            --label "runnumber=${GITHUB_RUN_ID}"

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Push image
        run: |
          GHCR_IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME

          # Change all uppercase to lowercase
          GHCR_IMAGE_ID=$(echo $GHCR_IMAGE_ID | tr '[A-Z]' '[a-z]')

          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          # Use Docker `latest` tag convention
          [ "$VERSION" == "master" ] && VERSION=stage
          echo GHCR_IMAGE_ID=$GHCR_IMAGE_ID
          echo VERSION=$VERSION

          docker tag $IMAGE_NAME $GHCR_IMAGE_ID:${GITHUB_SHA}
          docker tag $IMAGE_NAME $GHCR_IMAGE_ID:${VERSION}
          docker push $GHCR_IMAGE_ID:${GITHUB_SHA}
          docker push $GHCR_IMAGE_ID:${VERSION}

      # Deploy runs manually: GitHub-hosted runners cannot reach Nomad
      # or Vault on the mb-hel network. See operations/MANUAL-DEPLOY.md
