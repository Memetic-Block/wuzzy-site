      #   run: |
      #     VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
      #     [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
      #     [ "$VERSION" == "master" ] && VERSION=stage
      #     COMMIT_TIMESTAMP_ISO=$(date -u -d "${{ github.event.head_commit.timestamp }}" +"%Y-%m-%dT%H:%M:%SZ")
      #     sed -i "s/\[\[ .release_tag \]\]/${VERSION}/g" operations/wuzzy-site-static-stage.hcl
      #     sed -i "s/\[\[ .commit_timestamp \]\]/${COMMIT_TIMESTAMP_ISO}/g" operations/wuzzy-site-static-stage.hcl
      #     sed -i "s/\[\[ .commit_sha \]\]/${{ github.sha }}/g" operations/wuzzy-site-static-stage.hcl
